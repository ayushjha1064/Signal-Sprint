services:
  backend:
    build:
      context: ./app
      dockerfile: backend/Dockerfile
    env_file:
      - ./app/backend/.env
    environment:
      MODEL_FILE: /app/piro_model/model.pkl
      PREDICT_SCRIPT: /app/piro_model/predict.py
      UPLOAD_DIR: /app/backend/uploads
      CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
    ports:
      - "8000:8000"
    volumes:
      - ./app/piro_model:/app/piro_model
      - ./app/backend/uploads:/app/backend/uploads

  frontend:
    build:
      context: ./app
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
